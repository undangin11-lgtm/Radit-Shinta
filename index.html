<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undangan Pernikahan</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #000;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
    }

    /* ===== FRAME 9:16 (FIX SEMUA DEVICE) ===== */
    .frame {
      position: relative;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 9 / 16;
      background: #000;
      overflow: hidden;
    }

    /* ===== VIDEO ===== */
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* ===== COVER ===== */
    .cover {
      position: absolute;
      inset: 0;
      background: url('cover.jpg') center/cover no-repeat;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 90px;
      z-index: 5;
      transition: opacity 1.4s ease;
    }

    .cover.hide {
      opacity: 0;
      pointer-events: none;
    }

    /* ===== BOX MEWAH ===== */
    .box {
      position: relative;
      width: 90%;
      max-width: 360px;
      padding: 26px 26px 30px;
      text-align: center;
      color: #fff;
      background: rgba(20,20,20,0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 20px;
      animation: fadeLuxury 1.4s ease;
    }

    .box::before {
      content: "";
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #d4af37, transparent);
    }

    @keyframes fadeLuxury {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .label {
      font-size: 13px;
      letter-spacing: 1px;
      opacity: .85;
      margin-bottom: 10px;
    }

    .guest {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 22px;
    }

    .btn-open {
      background: linear-gradient(135deg,#e6c76e,#c9a437);
      color: #2b2108;
      border: none;
      padding: 14px 38px;
      border-radius: 30px;
      font-size: 15px;
      letter-spacing: .5px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,.35);
    }
  </style>
</head>
<body>

  <div class="frame">

    <!-- COVER -->
    <div class="cover" id="cover">
      <div class="box">
        <div class="label">KEPADA YTH</div>
        <div class="guest" id="guest">Tamu Undangan</div>
        <button class="btn-open" onclick="openInvite()">Buka Undangan</button>
      </div>
    </div>

    <!-- VIDEO (MUSIK DARI VIDEO) -->
    <video id="video" muted playsinline preload="auto">
      <source src="video.mp4" type="video/mp4">
    </video>

  </div>

  <script>
    // Ambil nama tamu
    const params = new URLSearchParams(window.location.search);
    const guest = params.get('to');
    if (guest) {
      document.getElementById('guest').innerText =
        decodeURIComponent(guest.replace(/\+/g, ' '));
    }

    function openInvite() {
      const cover = document.getElementById('cover');
      const video = document.getElementById('video');

      cover.classList.add('hide');

      video.muted = false;
      video.play();

      setTimeout(() => {
        cover.style.display = 'none';
      }, 1400);
    }
  </script>

</body>
</html>
